name: Android APK – build and signed prerelease

on:
  push:
    branches: [main]
    tags: ['v0.1.0-alpha.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Check source version and tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo 'Tag does not match the application version.' >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and web bundle
        run: npm run build
      - name: Regression tests
        run: |
          npx tsc -p tsconfig.preview.json
          node --test tests/alpha26-full-backup.test.mjs tests/alpha27-display-lock.test.mjs tests/alpha28-home-search-safearea.test.mjs tests/alpha29-license-release.test.mjs
      - name: Create native Android project
        run: |
          npx --no-install cap add android
          npx --no-install cap sync android
          python3 scripts/configure-android.py
      - name: Debug APK – test only (non-tagged builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          set -euo pipefail
          (cd android && bash ./gradlew --no-daemon assembleDebug)
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/FieLanzen-Offline-${VERSION}-debug-UNSTABLE-KEY.apk"
          (cd release && sha256sum "FieLanzen-Offline-${VERSION}-debug-UNSTABLE-KEY.apk" > "FieLanzen-Offline-${VERSION}-debug-UNSTABLE-KEY.apk.sha256")
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: fielanzen-debug-${{ github.sha }}
          path: release/*
          retention-days: 14
          if-no-files-found: error
      - name: Sign release APK (tag only; user-owned signing key)
        if: ${{ startsWith(github.ref, 'refs/tags/v0.1.0-alpha.') }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          umask 077
          KS="$RUNNER_TEMP/fielanzen-release.jks"
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS"
          (cd android && bash ./gradlew --no-daemon assembleRelease)
          APK_UNSIGNED='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          [[ -s "$APK_UNSIGNED" ]] || { echo 'Unsigned release APK missing.' >&2; exit 1; }
          mkdir -p release
          ALIGNED="$RUNNER_TEMP/fielanzen-aligned.apk"
          DEST="release/FieLanzen-Offline-${VERSION}-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$APK_UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KS" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$DEST" "$ALIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$DEST"
          (cd release && sha256sum "FieLanzen-Offline-${VERSION}-release.apk" > "FieLanzen-Offline-${VERSION}-release.apk.sha256")
      - uses: actions/upload-artifact@v4
        if: ${{ startsWith(github.ref, 'refs/tags/v0.1.0-alpha.') }}
        with:
          name: fielanzen-signed-${{ github.ref_name }}
          path: release/*
          retention-days: 30
          if-no-files-found: error

  publish-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v0.1.0-alpha.') }}
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fielanzen-signed-${{ github.ref_name }}
          path: release
      - name: Publish signed prerelease with checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release -name '*-release.apk' -type f | wc -l)" -eq 1
          gh release create "$TAG" release/*.apk release/*.sha256 \
            --repo "$REPO" --target "$GITHUB_SHA" --prerelease \
            --title "FieLanzen Offline $TAG" \
            --notes 'Signed Android prerelease; backup your data before updating. The complete corresponding source is available from the Source code archives attached to this tag. See README.md and LICENSE. Do not install over an APK signed with a different certificate.'
