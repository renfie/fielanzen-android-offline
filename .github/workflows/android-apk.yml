name: Android APK – build and signed prerelease

on:
  push:
    branches: [main, developer]
    tags: ['v0.1.0-alpha.*']
  workflow_dispatch:
    inputs:
      publish_signed_release:
        description: 'Publish signed prerelease for package.json version (main branch only)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_version.outputs.release_tag }}
      release_requested: ${{ steps.release_version.outputs.release_requested }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Check source version and release mode
        id: release_version
        shell: bash
        env:
          MANUAL_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_signed_release }}
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="v$VERSION"
          [[ "$VERSION" =~ ^0\.1\.0-alpha\.[0-9]+$ ]] || { echo 'Unsupported alpha version.' >&2; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo 'Tag does not match package.json version.' >&2
            exit 1
          fi
          if [[ "$MANUAL_RELEASE" == true && "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Manual signed releases must run on main.' >&2
            exit 1
          fi
          REQUESTED=false
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            REQUESTED=true
          elif [[ "$MANUAL_RELEASE" == true ]]; then
            REQUESTED=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == 'refs/heads/main' ]]; then
            # A normal source change is debug-only. Publish automatically only when
            # package.json's VERSION actually increases on main, in this commit.
            PREVIOUS_VERSION="$(git show HEAD^:package.json | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).version));')"
            if [[ "$PREVIOUS_VERSION" != "$VERSION" ]]; then
              if [[ "$PREVIOUS_VERSION" =~ ^0\.1\.0-alpha\.([0-9]+)$ && "$VERSION" =~ ^0\.1\.0-alpha\.([0-9]+)$ ]]; then
                PREVIOUS_NUMBER="${PREVIOUS_VERSION##*.}"
                NEW_NUMBER="${VERSION##*.}"
                if (( 10#$NEW_NUMBER <= 10#$PREVIOUS_NUMBER )); then
                  echo 'Release version must increase monotonically.' >&2
                  exit 1
                fi
                REQUESTED=true
                echo "New version $VERSION (was $PREVIOUS_VERSION): signed release requested."
              else
                echo 'Unsupported version change.' >&2
                exit 1
              fi
            fi
          fi
          echo "release_requested=$REQUESTED" >> "$GITHUB_OUTPUT"
          echo "Release requested: $REQUESTED"

      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and web bundle
        run: npm run build
      - name: Regression tests
        run: |
          npx tsc -p tsconfig.preview.json
          node --test tests/alpha26-full-backup.test.mjs tests/alpha27-display-lock.test.mjs tests/alpha28-home-search-safearea.test.mjs tests/alpha29-license-release.test.mjs tests/alpha30-licensing-safearea-release.test.mjs tests/alpha31-copyright.test.mjs tests/server-local-visual-parity.test.mjs tests/server-recurring-api.test.mjs tests/alpha33-suggestions.test.mjs tests/alpha34-home-report.test.mjs tests/alpha35-history.test.mjs tests/alpha36-svg-charts.test.mjs
      - name: Create native Android project
        run: |
          npx --no-install cap add android
          npx --no-install cap sync android
          python3 scripts/configure-android.py
      - name: Debug APK – test only (non-tagged builds)
        if: ${{ steps.release_version.outputs.release_requested != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          (cd android && bash ./gradlew --no-daemon assembleDebug)
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/FieLanzen-Offline-${VERSION}-debug-UNSTABLE-KEY.apk"
          (cd release && sha256sum "FieLanzen-Offline-${VERSION}-debug-UNSTABLE-KEY.apk" > "FieLanzen-Offline-${VERSION}-debug-UNSTABLE-KEY.apk.sha256")
      - uses: actions/upload-artifact@v7
        if: ${{ steps.release_version.outputs.release_requested != 'true' }}
        with:
          name: fielanzen-debug-${{ github.sha }}
          path: release/*
          retention-days: 14
          if-no-files-found: error
      - name: Sign release APK (version bump, tag, or manual release)
        if: ${{ steps.release_version.outputs.release_requested == 'true' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          umask 077
          KS="$RUNNER_TEMP/fielanzen-release.jks"
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS"
          (cd android && bash ./gradlew --no-daemon assembleRelease)
          APK_UNSIGNED='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          [[ -s "$APK_UNSIGNED" ]] || { echo 'Unsigned release APK missing.' >&2; exit 1; }
          mkdir -p release
          ALIGNED="$RUNNER_TEMP/fielanzen-aligned.apk"
          DEST="release/FieLanzen-Offline-${VERSION}-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$APK_UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KS" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$DEST" "$ALIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$DEST"
          (cd release && sha256sum "FieLanzen-Offline-${VERSION}-release.apk" > "FieLanzen-Offline-${VERSION}-release.apk.sha256")
      - uses: actions/upload-artifact@v7
        if: ${{ steps.release_version.outputs.release_requested == 'true' }}
        with:
          name: fielanzen-signed-${{ steps.release_version.outputs.release_tag }}
          path: release/*
          retention-days: 30
          if-no-files-found: error

  publish-release:
    if: ${{ needs.build-apk.outputs.release_requested == 'true' }}
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: fielanzen-signed-${{ needs.build-apk.outputs.release_tag }}
          path: release
      - name: Publish signed prerelease with checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-apk.outputs.release_tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release -name '*-release.apk' -type f | wc -l)" -eq 1
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Refusing to publish twice." >&2
            exit 1
          fi
          gh release create "$TAG" release/*.apk release/*.sha256 \
            --repo "$REPO" --target "$GITHUB_SHA" --prerelease \
            --title "FieLanzen Offline $TAG" \
            --notes 'Signed Android prerelease; backup your data before updating. The complete corresponding source is available from the Source code archives attached to this tag. See README.md and LICENSE. Do not install over an APK signed with a different certificate.'
