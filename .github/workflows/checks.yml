name: Quellcode-Prüfung (Android)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  source-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
      - name: Web-App und TypeScript prüfen
        run: npm run build
      - name: Testvorschau erzeugen
        run: npx tsc -p tsconfig.preview.json
      - name: Aktuelle gezielte Regressionstests
        run: node --test tests/alpha26-full-backup.test.mjs tests/alpha27-display-lock.test.mjs tests/alpha28-home-search-safearea.test.mjs tests/alpha29-license-release.test.mjs tests/alpha30-licensing-safearea-release.test.mjs tests/alpha31-copyright.test.mjs tests/server-local-visual-parity.test.mjs tests/server-recurring-api.test.mjs tests/alpha33-suggestions.test.mjs tests/alpha34-home-report.test.mjs tests/alpha35-history.test.mjs tests/alpha36-svg-charts.test.mjs
